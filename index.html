<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Iqbal TikTok</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;background:#000;color:#fff;font-family:Arial,system-ui,sans-serif;overflow:hidden}.app{width:100%;max-width:520px;height:100dvh;margin:auto;position:relative;background:#000}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.video-card{height:100dvh;min-height:560px;position:relative;scroll-snap-align:start;background:#111;overflow:hidden}.video-card video,.video-card img{width:100%;height:100%;object-fit:cover;background:#111}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%,transparent 48%,rgba(0,0,0,.86) 100%);pointer-events:none}.top{position:absolute;top:0;left:0;right:0;padding:15px 16px;padding-top:max(15px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;z-index:5}.logo{font-size:20px;font-weight:900;letter-spacing:-.4px}.logo i{font-style:normal;color:#ff315b}.tabs{display:flex;gap:17px;font-size:14px}.tabs span{opacity:.6}.tabs .active{opacity:1;font-weight:800}.info{position:absolute;left:16px;right:88px;bottom:86px;z-index:5}.user{font-size:17px;font-weight:800;margin-bottom:7px}.caption{font-size:15px;line-height:1.4;text-shadow:0 1px 3px #000}.music{margin-top:9px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{position:absolute;right:10px;bottom:86px;display:flex;flex-direction:column;align-items:center;gap:15px;z-index:6}.action{width:52px;border:0;background:none;color:#fff;font-size:28px;cursor:pointer;text-shadow:0 1px 5px #000}.action small{display:block;font-size:10px;margin-top:2px;font-weight:700}.liked{color:#ff315b}.avatar{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#ff315b,#7c3cff);display:flex;align-items:center;justify-content:center;font-size:22px}.playhint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:48px;opacity:0;transition:.2s}.paused .playhint{opacity:.75}.bottom{position:absolute;left:0;right:0;bottom:0;height:66px;padding-bottom:env(safe-area-inset-bottom);background:rgba(0,0,0,.96);display:flex;justify-content:space-around;align-items:center;z-index:10}.nav{border:0;background:none;color:#fff;font-size:11px;cursor:pointer}.nav b{display:block;font-size:22px;margin-bottom:1px}.add-upload-btn{background:#fff;color:#111;border:0;padding:9px 18px;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer}.add-upload-btn span{color:#ff315b}.modal,.profile,.search,.inbox{display:none;position:absolute;inset:0;z-index:30}.modal{background:rgba(0,0,0,.78);align-items:flex-end}.sheet{width:100%;background:#fff;color:#111;padding:20px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto}.sheet h2{font-size:22px}.close{float:right;border:0;border-radius:50%;width:36px;height:36px;font-size:22px;cursor:pointer}.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.pick label{padding:18px;border-radius:14px;background:#f0f0f0;text-align:center;font-weight:800;cursor:pointer}.form{display:none;margin-top:15px}.form video,.form img{width:100%;max-height:330px;border-radius:14px;background:#000;object-fit:cover}.form input,.form textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:12px;font-size:15px;outline:none}.publish{width:100%;padding:14px;border:0;border-radius:13px;background:#111;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.progress{display:none;margin-top:10px;height:8px;background:#eee;border-radius:10px;overflow:hidden}.progress div{width:0;height:100%;background:#ff315b}.status{font-size:12px;color:#666;margin-top:7px}.profile,.search,.inbox{background:#fff;color:#111;padding:22px;overflow:auto}.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:25px}.back{border:0;background:#f0f0f0;border-radius:10px;padding:9px 12px;font-size:18px}.profile-card{text-align:center;padding:15px}.bigavatar{width:82px;height:82px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#ff315b,#7c3cff);display:grid;place-items:center;font-size:36px}.stats{display:flex;justify-content:center;gap:30px;margin:18px 0}.stat b{display:block;font-size:19px}.muted{color:#777}.searchbox{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;font-size:16px}.result{margin-top:15px}.empty{text-align:center;color:#777;padding:45px 10px}.share-sheet{display:none;position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:60;align-items:flex-end}.share-panel{width:100%;background:#fff;color:#111;border-radius:24px 24px 0 0;padding:20px}.share-panel h3{font-size:20px;margin-bottom:14px}.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.share-option{border:0;background:#f1f1f1;border-radius:14px;padding:14px 8px;font-size:13px;font-weight:800;cursor:pointer}.share-option b{display:block;font-size:25px;margin-bottom:5px}.share-cancel{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800}.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,20,.94);color:#fff;padding:11px 15px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body><div class="app">
<div class="feed" id="feed"><div class="empty">Loading videos…</div></div>
<div class="profile" id="profile"><div class="pagehead"><button class="back" onclick="closePage('profile')">←</button><h2>Profile</h2></div><div class="profile-card"><div class="bigavatar">👤</div><h2 style="margin-top:12px">@iqbal_official</h2><p class="muted" style="margin-top:7px">Video Creator</p><div class="stats"><div class="stat"><b id="myVideos">0</b><span class="muted">Videos</span></div><div class="stat"><b>0</b><span class="muted">Followers</span></div><div class="stat"><b>0</b><span class="muted">Following</span></div></div></div><hr><div class="empty">Your published videos will appear here.</div></div>
<div class="search" id="searchPage"><div class="pagehead"><button class="back" onclick="closePage('searchPage')">←</button><h2>Search</h2></div><input id="searchInput" class="searchbox" placeholder="Search creators or captions…"><div id="searchResults" class="result"></div></div>
<div class="inbox" id="inboxPage"><div class="pagehead"><button class="back" onclick="closePage('inboxPage')">←</button><h2>Inbox</h2></div><div class="empty">❤️ Likes, comments and notifications will appear here.</div></div>
<div class="bottom"><button class="nav" onclick="home()"><b>⌂</b>Home</button><button class="nav" onclick="openPage('searchPage')"><b>⌕</b>Search</button><button class="add-upload-btn" onclick="openUpload()"><span>＋</span> Upload</button><button class="nav" onclick="openPage('inboxPage')"><b>♡</b>Inbox</button><button class="nav" onclick="openPage('profile')"><b>◉</b>Profile</button></div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeUpload()">×</button><h2>Create Video / Photo</h2><p class="muted" style="margin-top:6px">Choose a video or photo from your camera or gallery.</p><div class="pick"><label for="cameraFile">📷 Camera</label><label for="galleryFile">🖼️ Gallery</label></div><input id="cameraFile" type="file" accept="video/*,image/*" capture="environment" hidden><input id="galleryFile" type="file" accept="video/*,image/*" hidden><div class="form" id="form"><div id="previewContainer"></div><input id="username" maxlength="40" placeholder="@username"><textarea id="caption" maxlength="180" rows="3" placeholder="Write a caption…"></textarea><button class="publish" id="publishBtn" onclick="publishMedia()">Publish Now</button><div class="progress" id="progress"><div id="progressBar"></div></div><div class="status" id="status"></div></div></div></div>
<div class="share-sheet" id="shareSheet"><div class="share-panel"><h3>Share Video</h3><div class="share-grid"><button class="share-option" onclick="nativeShare()"><b>📤</b>Share</button><button class="share-option" onclick="copyShareLink()"><b>🔗</b>Copy Link</button><button class="share-option" onclick="shareWhatsApp()"><b>💬</b>WhatsApp</button></div><button class="share-cancel" onclick="closeShare()">Cancel</button></div></div><div class="toast" id="toast"></div>
</div>
<script>
const CLOUD_NAME = "uy00rl24";
const UPLOAD_PRESET = "iqbal_preset";

let selectedFile = null, allVideos = [];
const feed = document.getElementById('feed'), modal = document.getElementById('modal');

function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),2600)}
const showToast=toast;
function escapeHTML(t){return String(t??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function renderVideos(videos){
    allVideos = videos;
    feed.innerHTML = '';
    if(!videos.length){
        videos = [{videoUrl:'https://res.cloudinary.com/uy00rl24/video/upload/v1/samples/elephants.mp4',username:'@iqbal_official',caption:'Welcome to Iqbal TikTok 🎬',type:'video'}];
    }
    videos.forEach(v=>{
        const card = document.createElement('section');
        card.className = 'video-card';
        if(v.type === 'image'){
            card.innerHTML = `<img src="${escapeHTML(v.videoUrl)}" alt="Post"><div class="shade"></div><div class="top"><div class="logo">Iqbal <i>TikTok</i></div><div class="tabs"><span class="active">For You</span><span>Following</span></div></div><div class="info"><div class="user">${escapeHTML(v.username||'@iqbal_official')}</div><div class="caption">${escapeHTML(v.caption||'My new photo 📸')}</div><div class="music">♫ Original sound</div></div><div class="actions"><button class="action like">♡<small>Like</small></button><button class="action comment">💬<small>Comment</small></button><button class="action sound">🔇<small>Sound</small></button><button class="action share">↗<small>Share</small></button><div class="avatar">👤</div></div>`;
        } else {
            card.innerHTML = `<video src="${escapeHTML(v.videoUrl)}" loop muted playsinline preload="metadata"></video><div class="shade"></div><div class="playhint">▶</div><div class="top"><div class="logo">Iqbal <i>TikTok</i></div><div class="tabs"><span class="active">For You</span><span>Following</span></div></div><div class="info"><div class="user">${escapeHTML(v.username||'@iqbal_official')}</div><div class="caption">${escapeHTML(v.caption||'My new video 🎬')}</div><div class="music">♫ Original sound</div></div><div class="actions"><button class="action like">♡<small>Like</small></button><button class="action comment">💬<small>Comment</small></button><button class="action sound">🔇<small>Sound</small></button><button class="action share">↗<small>Share</small></button><div class="avatar">👤</div></div>`;
        }
        feed.appendChild(card);
        setupCard(card, v.type);
    });
    observeCards();
}

function loadGlobalFeed(){
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem('iqbal_videos') || '[]'); } catch(e){}
    renderVideos(saved);
}

function setupCard(card, type){
    const video = card.querySelector('video'), like = card.querySelector('.like'), sound = card.querySelector('.sound'), comment = card.querySelector('.comment'), share = card.querySelector('.share');
    if(like) like.onclick = e => { e.stopPropagation(); like.classList.toggle('liked'); like.firstChild.textContent = like.classList.contains('liked') ? '♥' : '♡'; };
    if(sound && video) {
        sound.onclick = e => { e.stopPropagation(); video.muted = !video.muted; sound.firstChild.textContent = video.muted ? '🔇' : '🔊'; if(!video.muted) video.play().catch(()=>{}); };
        video.onclick = () => { if(video.paused){ video.play().catch(()=>{}); card.classList.remove('paused'); } else { video.pause(); card.classList.add('paused'); } };
    }
    if(comment) comment.onclick = e => { e.stopPropagation(); showToast('Comments feature is active.'); };
    if(share) share.onclick = e => { e.stopPropagation(); window.currentShareUrl = video ? (video.currentSrc||video.src) : card.querySelector('img').src; openShare(); };
}

function openShare(){ document.getElementById('shareSheet').style.display='flex'; }
function closeShare(){ document.getElementById('shareSheet').style.display='none'; }
async function nativeShare(){ const url=window.currentShareUrl||location.href; try{if(navigator.share){await navigator.share({title:'Iqbal TikTok',text:'Watch this video 🎬',url});closeShare()}else{copyShareLink()}}catch(e){if(e.name!=='AbortError')showToast('Share cancelled')} }
async function copyShareLink(){ const url=window.currentShareUrl||location.href; try{await navigator.clipboard.writeText(url);showToast('Link copied!');closeShare()}catch(e){showToast('Copy failed')} }
function shareWhatsApp(){ const url=window.currentShareUrl||location.href; const text=encodeURIComponent('Watch this video 🎬 '+url); window.open('https://wa.me/?text='+text,'_blank','noopener'); closeShare(); }

function observeCards(){
    const obs = new IntersectionObserver(es => es.forEach(e => {
        const v = e.target;
        if(v.tagName === 'VIDEO') {
            if(e.isIntersecting){ v.play().catch(()=>{}); v.closest('.video-card').classList.remove('paused'); } else { v.pause(); }
        }
    }), {threshold:.7});
    document.querySelectorAll('.video-card video').forEach(v => obs.observe(v));
}

function openUpload(){ modal.style.display='flex'; }
function closeUpload(){ 
    modal.style.display='none'; 
    document.getElementById('form').style.display='none'; 
    selectedFile=null; 
    document.getElementById('previewContainer').innerHTML=''; 
    document.getElementById('cameraFile').value=''; 
    document.getElementById('galleryFile').value=''; 
    document.getElementById('status').textContent=''; 
    document.getElementById('progress').style.display='none'; 
}

function handleFile(e){
    const f = e.target.files[0];
    if(!f) return;
    if(f.size > 100 * 1024 * 1024) return showToast('File must be 100 MB or smaller.');
    selectedFile = f;
    const previewContainer = document.getElementById('previewContainer');
    if(f.type.startsWith('image/')) {
        previewContainer.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="Preview">`;
    } else {
        previewContainer.innerHTML = `<video src="${URL.createObjectURL(f)}" controls playsinline></video>`;
    }
    document.getElementById('form').style.display = 'block';
    document.getElementById('status').textContent = `${(f.size/1024/1024).toFixed(1)} MB selected`;
}

document.getElementById('cameraFile').onchange = handleFile;
document.getElementById('galleryFile').onchange = handleFile;

async function publishMedia(){
    if(!selectedFile) return showToast('Choose a file first.');
    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = 'Uploading to Cloudinary…';
    
    const user = (document.getElementById('username').value.trim() || '@iqbal_official').replace(/\s+/g,'');
    const caption = document.getElementById('caption').value.trim() || 'My new post 🎬';
    const resourceType = selectedFile.type.startsWith('image') ? 'image' : 'video';

    const formData = new FormData();
    formData.append("file", selectedFile);
    formData.append("upload_preset", UPLOAD_PRESET);

    try {
        document.getElementById('progress').style.display = 'block';
        document.getElementById('progressBar').style.width = '50%';

        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        if(data.secure_url){
            document.getElementById('progressBar').style.width = '100%';
            
            const newPost = {
                videoUrl: data.secure_url,
                username: user,
                caption: caption,
                type: resourceType,
                createdAt: Date.now()
            };

            let saved = [];
            try { saved = JSON.parse(localStorage.getItem('iqbal_videos') || '[]'); } catch(e){}
            saved.unshift(newPost);
            localStorage.setItem('iqbal_videos', JSON.stringify(saved));

            showToast('Published successfully!');
            closeUpload();
            loadGlobalFeed();
        } else {
            showToast('Upload failed.');
        }
    } catch(e) {
        console.error(e);
        showToast('An error occurred during upload.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Publish Now';
    }
}

function openPage(id){ document.getElementById(id).style.display='block'; if(id==='profile') {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem('iqbal_videos') || '[]'); } catch(e){}
    document.getElementById('myVideos').textContent = saved.filter(v=>v.username==='@iqbal_official').length;
}}
function closePage(id){ document.getElementById(id).style.display='none'; }
function home(){ ['profile','searchPage','inboxPage'].forEach(id=>document.getElementById(id).style.display='none'); feed.scrollTo({top:0,behavior:'smooth'}); }

document.getElementById('searchInput').oninput = e => {
    const q = e.target.value.toLowerCase().trim();
    const r = document.getElementById('searchResults');
    if(!q){ r.innerHTML=''; return; }
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem('iqbal_videos') || '[]'); } catch(e){}
    const hits = saved.filter(v => (v.username||'').toLowerCase().includes(q) || (v.caption||'').toLowerCase().includes(q));
    r.innerHTML = hits.length ? hits.map(v => `<div style="padding:12px 0;border-bottom:1px solid #eee"><b>${escapeHTML(v.username)}</b><div class="muted">${escapeHTML(v.caption)}</div></div>`).join('') : '<div class="empty">No videos found.</div>';
};

window.onload = loadGlobalFeed;
</script></body></html>
