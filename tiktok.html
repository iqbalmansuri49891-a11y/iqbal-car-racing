<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Videos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #000; position: relative; display: flex; flex-direction: column; }
        
        /* Top Header */
        .top-header { position: absolute; top: 12px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 10; font-size: 16px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .top-header .title { font-size: 18px; }
        .top-tabs-right { display: flex; gap: 15px; font-size: 14px; }
        .top-tabs-right span { opacity: 0.6; cursor: pointer; }
        .top-tabs-right span.active { opacity: 1; }

        /* Feed */
        .feed-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; position: relative; width: 100%; height: 100vh; scrollbar-width: none; }
        .feed-container::-webkit-scrollbar { display: none; }
        .video-card { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; background: #111; display: flex; justify-content: center; align-items: center; }
        .video-card video, .video-card img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Overlay Info */
        .overlay { position: absolute; bottom: 75px; left: 15px; right: 75px; z-index: 5; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
        .overlay h3 { margin-bottom: 5px; font-size: 16px; font-weight: bold; }
        .overlay p { font-size: 14px; opacity: 0.95; margin-bottom: 5px; }
        .music-info { font-size: 12px; opacity: 0.8; }

        /* Right Actions */
        .side-actions { position: absolute; right: 15px; bottom: 85px; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 5; }
        .action-btn { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 22px; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .action-btn span { font-size: 11px; font-weight: 600; }

        /* Bottom Nav Bar */
        .nav-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 55px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; }
        .nav-item { color: #888; font-size: 11px; cursor: pointer; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #fff; }
        .upload-nav-btn { background: #fff; color: #000; width: 90px; height: 36px; border-radius: 8px; font-size: 14px; font-weight: bold; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; gap: 5px; }

        /* Create Video Popup Modal */
        .upload-modal { position: absolute; bottom: 0; left: 0; width: 100%; background: #1a1a1a; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 200; display: none; flex-direction: column; padding: 25px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        .upload-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .upload-modal-header h3 { font-size: 18px; }
        .close-modal { background: #333; color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; }
        .upload-modal p { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 15px; margin-bottom: 15px; }
        .modal-btn { flex: 1; background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 15px; border-radius: 12px; font-size: 14px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .caption-input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Header -->
    <div class="top-header">
        <span class="title">Short Videos</span>
        <div class="top-tabs-right">
            <span class="active">For You</span>
            <span>Following</span>
        </div>
    </div>

    <!-- Feed -->
    <div class="feed-container" id="feedContainer">
        <div class="video-card">
            <video id="mainVideo" src="https://res.cloudinary.com/uy00rl24/video/upload/v1/samples/elephants.mp4" autoplay loop playsinline></video>
            <div class="overlay">
                <h3>@iqbaluser</h3>
                <p>My new video[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)</p>
                <div class="music-info">🎵 Original sound</div>
            </div>
            <div class="side-actions">
                <button class="action-btn" onclick="toggleLike(this)">🤍<span>Like</span></button>
                <button class="action-btn" onclick="openCommentBox()">💬<span>Comment</span></button>
                <button class="action-btn" onclick="toggleSound(this)">🔊<span>Sound</span></button>
                <button class="action-btn" onclick="shareContent()">↗️<span>Share</span></button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="upload-modal" id="uploadModal">
        <div class="upload-modal-header">
            <h3>Create Video</h3>
            <button class="close-modal" onclick="toggleUploadModal()">✕</button>
        </div>
        <p>Choose a video from your camera or gallery[span_4](start_span)[span_4](end_span).</p>
        <input type="text" id="captionInput" class="caption-input" placeholder="Enter video caption...">
        <div class="modal-buttons">
            <button class="modal-btn" onclick="document.getElementById('fileInput').click()">
                📷 Gallery / Camera
            </button>
        </div>
        <input type="file" id="fileInput" accept="video/*,image/*" style="display:none;" onchange="uploadMedia()">
    </div>

    <!-- Bottom Nav Bar -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="window.scrollTo(0,0)">🏠<span>Home</span></button>
        <button class="nav-item" onclick="alert('Search feature activated!')">🔍<span>Search</span></button>
        <button class="upload-nav-btn" onclick="toggleUploadModal()">+ Upload</button>
        <button class="nav-item" onclick="alert('Inbox is clear.')">📥<span>Inbox</span></button>
        <button class="nav-item" onclick="alert('Profile: Iqbal Mansuri')">👤<span>Profile</span></button>
    </div>
</div>

<script>
    const CLOUD_NAME = "uy00rl24";[span_5](start_span)[span_5](end_span)
    const UPLOAD_PRESET = "iqbal_preset";

    function toggleUploadModal() {
        const modal = document.getElementById('uploadModal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleLike(btn) {
        if (btn.style.color === 'rgb(254, 44, 85)') {
            btn.style.color = '#fff';
            btn.innerHTML = '🤍<span>Like</span>';
        } else {
            btn.style.color = '#fe2c55';
            btn.innerHTML = '❤️<span>Liked</span>';
        }
    }

    function toggleSound(btn) {
        const video = document.querySelector('.video-card video');
        if (video) {
            video.muted = !video.muted;
            if (video.muted) {
                btn.innerHTML = '🔇<span>Muted</span>';
            } else {
                btn.innerHTML = '🔊<span>Sound</span>';
            }
        }
    }

    function openCommentBox() {
        let comment = prompt("Apna comment likhein:");
        if (comment) {
            alert("Comment added successfully: " + comment);
        }
    }

    function shareContent() {
        if (navigator.share) {
            navigator.share({ title: 'Short Videos', url: window.location.href }).catch(() => {});
        } else {
            alert("Link copied to clipboard!");
        }
    }

    async function uploadMedia() {
        const fileInput = document.getElementById('fileInput');
        const captionInput = document.getElementById('captionInput');
        
        if (fileInput.files.length === 0) return;

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);

        alert("Uploading to Cloudinary...");
        toggleUploadModal();

        try {
            const resourceType = file.type.startsWith('image') ? 'image' : 'video';
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {[span_6](start_span)[span_6](end_span)
                method: "POST",
                body: formData
            });

            const data = await response.json();
            if (data.secure_url) {
                alert("Upload Successful!");
                addNewPostToFeed(data.secure_url, captionInput.value, resourceType);
                captionInput.value = '';
                fileInput.value = '';
            } else {
                alert("Upload failed.");
            }
        } catch (error) {
            console.error(error);
            alert("Error during upload.");
        }
    }

    function addNewPostToFeed(url, caption, type) {
        const feedContainer = document.getElementById('feedContainer');
        const card = document.createElement('div');
        card.className = 'video-card';

        if (type === 'video') {
            card.innerHTML = `
                <video src="${url}" controls autoplay loop playsinline style="width:100%; height:100%; object-fit:cover;"></video>
                <div class="overlay">
                    <h3>@iqbaluser</h3>
                    <p>${caption || 'My new video'}</p>
                    <div class="music-info">🎵 Original sound</div>
                </div>
                <div class="side-actions">
                    <button class="action-btn" onclick="toggleLike(this)">🤍<span>Like</span></button>
                    <button class="action-btn" onclick="openCommentBox()">💬<span>Comment</span></button>
                    <button class="action-btn" onclick="toggleSound(this)">🔊<span>Sound</span></button>
                    <button class="action-btn" onclick="shareContent()">↗️<span>Share</span></button>
                </div>
            `;
        } else {
            card.innerHTML = `
                <img src="${url}" style="width:100%; height:100%; object-fit:cover;">
                <div class="overlay">
                    <h3>@iqbaluser</h3>
                    <p>${caption || 'My new photo'}</p>
                    <div class="music-info">🎵 Original sound</div>
                </div>
                <div class="side-actions">
                    <button class="action-btn" onclick="toggleLike(this)">🤍<span>Like</span></button>
                    <button class="action-btn" onclick="openCommentBox()">💬<span>Comment</span></button>
                    <button class="action-btn" onclick="toggleSound(this)">🔊<span>Sound</span></button>
                    <button class="action-btn" onclick="shareContent()">↗️<span>Share</span></button>
                </div>
            `;
        }

        feedContainer.prepend(card);
        feedContainer.scrollTop = 0;
    }
</script>

</body>
</html>
