<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqbal TikTok App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #111; position: relative; display: flex; flex-direction: column; }
        .feed-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; position: relative; width: 100%; height: calc(100vh - 55px); }
        .video-card { width: 100%; height: 100%; scroll-snap-align: start; position: relative; background: #222; display: flex; justify-content: center; align-items: center; }
        .video-card video, .video-card img { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 20px; left: 15px; z-index: 2; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .overlay h3 { margin-bottom: 5px; font-size: 18px; color: #ff0050; }
        .overlay p { font-size: 14px; opacity: 0.9; }
        
        /* Fixed Bottom Navigation Bar */
        .nav-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 55px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 100; }
        .nav-item { color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; background: none; border: none; padding: 10px; }
        .nav-item:active { color: #fe2c55; }

        /* Upload Modal */
        .upload-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .upload-modal h2 { margin-bottom: 20px; color: #ff0050; }
        .upload-modal input, .upload-modal button { width: 100%; max-width: 300px; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        .upload-modal input { background: #222; color: #fff; border: 1px solid #444; }
        .upload-modal button { background: #fe2c55; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Main Feed -->
    <div class="feed-container" id="feedContainer">
        <div class="video-card">
            <div class="overlay">
                <h3>Iqbal TikTok</h3>
                <p>Welcome! Tap 'Upload' below to share your video or photo.</p>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="upload-modal" id="uploadModal">
        <h2>Upload to TikTok</h2>
        <input type="text" id="captionInput" placeholder="Enter video caption...">
        <input type="file" id="fileInput" accept="video/*,image/*">
        <button onclick="uploadMedia()">Upload Now</button>
        <button onclick="toggleUploadModal()" style="background:#444;">Cancel</button>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <button class="nav-item" onclick="window.scrollTo(0,0)">Home</button>
        <button class="nav-item" onclick="toggleUploadModal()" style="color: #fe2c55;">+ Upload</button>
        <button class="nav-item" onclick="alert('Profile section coming soon!')">Profile</button>
    </div>
</div>

<script>
    // Cloudinary Credentials Set
    const CLOUD_NAME = "uy00rl24";[span_0](start_span)[span_0](end_span)
    const UPLOAD_PRESET = "iqbal_preset";

    function toggleUploadModal() {
        const modal = document.getElementById('uploadModal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    async function uploadMedia() {
        const fileInput = document.getElementById('fileInput');
        const captionInput = document.getElementById('captionInput');
        
        if (fileInput.files.length === 0) {
            alert("Please select a file first!");
            return;
        }

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);

        alert("Uploading to Cloudinary, please wait...");

        try {
            const resourceType = file.type.startsWith('image') ? 'image' : 'video';
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {[span_1](start_span)[span_1](end_span)
                method: "POST",
                body: formData
            });

            const data = await response.json();
            if (data.secure_url) {
                alert("Upload Successful!");
                
                // Naya post feed mein add karne ke liye
                addNewPostToFeed(data.secure_url, captionInput.value, resourceType);
                
                toggleUploadModal();
                fileInput.value = '';
                captionInput.value = '';
            } else {
                alert("Upload failed. Try again.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred during upload.");
        }
    }

    function addNewPostToFeed(url, caption, type) {
        const feedContainer = document.getElementById('feedContainer');
        const card = document.createElement('div');
        card.className = 'video-card';

        if (type === 'video') {
            card.innerHTML = `
                <video src="${url}" controls autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>
                <div class="overlay">
                    <h3>@iqbal_tiktok</h3>
                    <p>${caption || 'My new video'}</p>
                </div>
            `;
        } else {
            card.innerHTML = `
                <img src="${url}" alt="Uploaded Image" style="width:100%; height:100%; object-fit:cover;">
                <div class="overlay">
                    <h3>@iqbal_tiktok</h3>
                    <p>${caption || 'My new photo'}</p>
                </div>
            `;
        }

        feedContainer.prepend(card);
        feedContainer.scrollTop = 0;
    }
</script>

</body>
</html>
