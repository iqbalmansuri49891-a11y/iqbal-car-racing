<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Iqbal Video - Short Videos</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  margin:auto;
  position:relative;
  background:#000;
}

.feed{
  width:100%;
  height:100%;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

.video-card{
  width:100%;
  height:100dvh;
  position:relative;
  scroll-snap-align:start;
  background:#111;
}

.video-card video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

.shade{
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 45%,
    rgba(0,0,0,.85)
  );
  pointer-events:none;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:18px;
  padding-top:max(18px,env(safe-area-inset-top));
  display:flex;
  justify-content:space-between;
  z-index:5;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.tabs span{
  margin-left:15px;
  opacity:.65;
}

.tabs .active{
  opacity:1;
  font-weight:bold;
}

.info{
  position:absolute;
  left:16px;
  right:90px;
  bottom:78px;
  z-index:5;
}

.user{
  font-size:17px;
  font-weight:bold;
}

.caption{
  margin-top:8px;
  font-size:15px;
  line-height:1.4;
}

.music{
  margin-top:9px;
  font-size:13px;
}

.actions{
  position:absolute;
  right:12px;
  bottom:78px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:17px;
  z-index:6;
}

.action{
  border:0;
  background:none;
  color:#fff;
  font-size:29px;
  cursor:pointer;
  text-shadow:0 1px 4px #000;
}

.action small{
  display:block;
  font-size:11px;
  margin-top:3px;
}

.liked{
  color:#ff315b;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  border:2px solid #fff;
  background:#444;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:62px;
  background:rgba(0,0,0,.96);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
}

.nav{
  border:0;
  background:none;
  color:#fff;
  font-size:12px;
  cursor:pointer;
}

.nav b{
  display:block;
  font-size:23px;
  margin-bottom:2px;
}

.add{
  font-size:32px;
}

.modal{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:30;
  align-items:flex-end;
}

.sheet{
  width:100%;
  background:#fff;
  color:#111;
  padding:20px;
  border-radius:22px 22px 0 0;
  max-height:90%;
  overflow:auto;
}

.close{
  float:right;
  border:0;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:20px;
  cursor:pointer;
}

.pick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.pick button{
  padding:17px;
  border:0;
  border-radius:12px;
  font-size:15px;
  background:#eee;
  cursor:pointer;
}

.form{
  display:none;
  margin-top:15px;
}

.form video{
  width:100%;
  border-radius:12px;
  background:#000;
}

.form input,
.form textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.publish{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.profile{
  display:none;
  position:absolute;
  inset:0;
  z-index:20;
  background:#fff;
  color:#111;
  padding:25px;
}

.profile button{
  padding:10px 15px;
  border:0;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="app">

<!-- VIDEO FEED -->
<div class="feed" id="feed">
  <div style="display:flex; justify-content:center; align-items:center; height:100%; color:#888;">Loading global feed...</div>
</div>


<!-- PROFILE -->
<div class="profile" id="profile">

<button onclick="closeProfile()">
← Back
</button>

<h2 style="margin-top:30px;">
@iqbaluser
</h2>

<p style="margin-top:10px;">
Iqbal Video Creator
</p>

<p style="margin-top:15px;">
<b>0</b> Followers &nbsp;&nbsp;
<b>0</b> Following
</p>

<hr style="margin-top:20px;">

<h3 style="margin-top:20px;">
Your Videos
</h3>

</div>


<!-- BOTTOM NAVIGATION -->
<div class="bottom">

<button class="nav" onclick="home()">
<b>⌂</b>
Home
</button>

<button class="nav">
<b>⌕</b>
Search
</button>

<button class="nav add" onclick="openUpload()">
＋
</button>

<button class="nav">
<b>♡</b>
Inbox
</button>

<button class="nav" onclick="openProfile()">
<b>◉</b>
Profile
</button>

</div>


<!-- UPLOAD MODAL -->
<div class="modal" id="modal">

<div class="sheet">

<button class="close" onclick="closeUpload()">
×
</button>

<h2>
Create Video
</h2>

<br>

<div class="pick">

<button onclick="camera()">
📷 Camera
</button>

<button onclick="gallery()">
🖼️ Gallery
</button>

</div>

<input
  id="file"
  type="file"
  accept="video/*"
  style="display:none"
>

<div class="form" id="form">

<video
  id="preview"
  controls>
</video>

<input
  id="username"
  placeholder="@username"
>

<textarea
  id="caption"
  rows="3"
  placeholder="Write a caption...">
</textarea>

<button
  class="publish"
  onclick="publishVideo()">
Publish Video
</button>

</div>

</div>
</div>

</div>


<script>
// Firebase Configuration
const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "iqbal-app-store.firebaseapp.com",
    databaseURL: "https://iqbal-app-store-default-rtdb.firebaseio.com",
    projectId: "iqbal-app-store",
    storageBucket: "iqbal-app-store.appspot.com",
    messagingSenderId: "123786659122",
    appId: "1:123786659122:web:df6d6ab40065f77882fab"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const feed = document.getElementById("feed");
const modal = document.getElementById("modal");
const file = document.getElementById("file");
const preview = document.getElementById("preview");

let selectedVideoBase64 = "";

/* LOAD VIDEOS FROM FIREBASE */
function loadGlobalFeed() {
    db.ref('videos').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            let videos = Object.keys(data).map(key => data[key]).reverse();
            let html = '';
            videos.forEach(v => {
                html += `
                <section class="video-card">
                    <video src="${v.videoUrl}" loop muted playsinline></video>
                    <div class="shade"></div>
                    <div class="top">
                      <div class="logo">Iqbal Video</div>
                      <div class="tabs">
                        <span class="active">For You</span>
                        <span>Following</span>
                      </div>
                    </div>
                    <div class="info">
                      <div class="user">${escapeHTML(v.username)}</div>
                      <div class="caption">${escapeHTML(v.caption)}</div>
                      <div class="music">♫ Original sound</div>
                    </div>
                    <div class="actions">
                      <button class="action like">♡<small>Like</small></button>
                      <button class="action comment">💬<small>Comment</small></button>
                      <button class="action sound">🔇<small>Sound</small></button>
                      <button class="action share">↗<small>Share</small></button>
                      <div class="avatar">👤</div>
                    </div>
                </section>
                `;
            });
            feed.innerHTML = html;
            document.querySelectorAll(".video-card").forEach(setupCard);
        } else {
            feed.innerHTML = `
            <section class="video-card">
                <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" loop muted playsinline></video>
                <div class="shade"></div>
                <div class="top">
                  <div class="logo">Iqbal Video</div>
                  <div class="tabs"><span class="active">For You</span><span>Following</span></div>
                </div>
                <div class="info">
                  <div class="user">@iqbalvideo</div>
                  <div class="caption">Welcome to Iqbal Video 🎬</div>
                  <div class="music">♫ Original sound</div>
                </div>
                <div class="actions">
                  <button class="action like">♡<small>Like</small></button>
                  <button class="action comment">💬<small>Comment</small></button>
                  <button class="action sound">🔇<small>Sound</small></button>
                  <button class="action share">↗<small>Share</small></button>
                  <div class="avatar">👤</div>
                </div>
            </section>
            `;
            document.querySelectorAll(".video-card").forEach(setupCard);
        }
    });
}

/* UPLOAD */
function openUpload(){
  modal.style.display="flex";
}

function closeUpload(){
  modal.style.display="none";
  document.getElementById("form").style.display="none";
  file.value="";
  selectedVideoBase64 = "";
}

function camera(){
  file.setAttribute("capture","environment");
  file.click();
}

function gallery(){
  file.removeAttribute("capture");
  file.click();
}

/* FILE SELECT & CONVERT TO BASE64 */
file.addEventListener("change", function(){
  if(!file.files[0]) return;
  
  const reader = new FileReader();
  reader.readAsDataURL(file.files[0]);
  reader.onloadend = function() {
      selectedVideoBase64 = reader.result;
      preview.src = selectedVideoBase64;
      document.getElementById("form").style.display = "block";
  };
});

/* VIDEO CONTROLS */
function setupCard(card){
  const video = card.querySelector("video");
  const like = card.querySelector(".like");
  const sound = card.querySelector(".sound");
  const comment = card.querySelector(".comment");
  const share = card.querySelector(".share");

  like.onclick = function(e){
    e.stopPropagation();
    like.classList.toggle("liked");
    like.firstChild.textContent = like.classList.contains("liked") ? "♥" : "♡";
  };

  sound.onclick = function(e){
    e.stopPropagation();
    video.muted = !video.muted;
    sound.firstChild.textContent = video.muted ? "🔇" : "🔊";
    if(!video.muted){ video.play().catch(()=>{}); }
  };

  video.onclick = function(){
    if(video.muted){
      video.muted = false;
      sound.firstChild.textContent = "🔊";
    }
    if(video.paused){ video.play().catch(()=>{}); }
    else { video.pause(); }
  };

  comment.onclick = function(e){
    e.stopPropagation();
    alert("Comments feature active.");
  };

  share.onclick = async function(e){
    e.stopPropagation();
    try{
      await navigator.share({ title:"Iqbal Video", text:"Watch this video on Iqbal Video" });
    }catch(error){}
  };

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){ video.play().catch(()=>{}); }
      else { video.pause(); }
    });
  }, {threshold:.65});

  observer.observe(video);
}

/* PUBLISH TO FIREBASE */
function publishVideo(){
  if(!selectedVideoBase64) return;

  const username = document.getElementById("username").value || "@iqbaluser";
  const caption = document.getElementById("caption").value || "My new video 🎬";

  const newRef = db.ref('videos').push();
  newRef.set({
      videoUrl: selectedVideoBase64,
      username: username,
      caption: caption,
      likes: Math.floor(Math.random() * 1000) + 10
  }, (error) => {
      if(error){
          alert("Upload failed! Try a smaller video.");
      } else {
          alert("Video successfully published for everyone!");
          closeUpload();
      }
  });
}

/* SECURITY */
function escapeHTML(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* PROFILE */
function openProfile(){
  document.getElementById("profile").style.display="block";
}

function closeProfile(){
  document.getElementById("profile").style.display="none";
}

function home(){
  closeProfile();
  feed.scrollTo({ top:0, behavior:"smooth" });
}

// Load feed on startup
window.onload = loadGlobalFeed;
</script>

</body>
</html>
