<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqbal Tok - Final Working App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; }

        /* Top Header */
        .header { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: center; gap: 20px; padding: 15px; z-index: 10; font-size: 16px; font-weight: bold; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .header span { opacity: 0.6; }
        .header span.active { opacity: 1; border-bottom: 2px solid #fff; padding-bottom: 4px; }

        /* Feed */
        #feed { width: 100vw; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .card { width: 100vw; height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: #111; }
        .card video { width: 100%; height: 100%; object-fit: cover; }

        /* Video Info */
        .info { position: absolute; bottom: 80px; left: 16px; right: 80px; z-index: 5; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .info h3 { font-size: 16px; margin-bottom: 6px; }
        .info p { font-size: 14px; opacity: 0.9; }

        /* Action Buttons on Right */
        .sidebar { position: absolute; bottom: 90px; right: 15px; z-index: 5; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .side-btn { background: rgba(0,0,0,0.4); border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 10px; cursor: pointer; }

        /* Bottom Navbar */
        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 20; border-top: 1px solid #222; }
        .nav-item { color: #888; font-size: 11px; text-align: center; cursor: pointer; }
        .nav-item.active { color: #fff; }
        
        /* Upload Button styling */
        .upload-tab { background: #ff3b5c; color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <span>Following</span>
        <span class="active">For You</span>
    </div>

    <div id="feed">
        <div class="card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop playsinline muted onclick="this.paused ? this.play() : this.pause()"></video>
            <div class="info">
                <h3>@iqbal_official</h3>
                <p>Welcome to Iqbal Tok! Tap video to play/pause.</p>
            </div>
            <div class="sidebar">
                <button class="side-btn" onclick="alert('Liked!')">❤️<br>10K</button>
                <button class="side-btn" onclick="alert('Saved!')">💾<br>Save</button>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active">🏠<br>Home</div>
        <div class="nav-item">🔍<br>Discover</div>
        
        <label for="fileInput" class="upload-tab">+ Upload</label>
        
        <div class="nav-item">📥<br>Inbox</div>
        <div class="nav-item">👤<br>Me</div>
    </div>

    <input type="file" id="fileInput" accept="video/*" style="display: none;" onchange="handleUpload(event)">

    <script>
        function handleUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const feed = document.getElementById('feed');
                
                const newCard = document.createElement('div');
                newCard.className = 'card';
                newCard.innerHTML = `
                    <video src="${url}" autoplay loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                    <div class="info">
                        <h3>@iqbal_creator</h3>
                        <p>My uploaded video #iqbaltok</p>
                    </div>
                    <div class="sidebar">
                        <button class="side-btn" onclick="alert('Liked!')">❤️<br>120</button>
                        <button class="side-btn" onclick="alert('Saved!')">💾<br>Save</button>
                    </div>
                `;
                
                feed.prepend(newCard);
                alert('Aapki video successfully add ho gayi hai!');
            }
        }
    </script>
</body>
</html>
